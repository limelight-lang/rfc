title: Граф вопросов — rc-cycle
source: model/gc/cycle/questions.md · 2026-08-25
spec:
  nodes: aspect · question · decision · rejected
  sources:
  - model/gc/cycle/questions.md
  - dev/DECISIONS.md
  edge: holds — питает или принадлежит · rejects — отклонено
nodes:
- id: a-transition
  kind: aspect
  title: Переход от rc-walk
  body: Что переходит в новый дизайн, что остаётся записью и по каким свидетельствам меняется
    умолчание реестра.
  origin: model/gc/cycle/questions.md, Y1 и Y8
- id: a-enrolment
  kind: aspect
  title: Занесение в подозреваемые при декременте
  body: Сторона мутатора — какой декремент рождает подозреваемого, сколько стоит проверка
    и где компилятор её убирает.
  origin: model/gc/cycle/questions.md, Y3, Y6, Y10, Y11
- id: a-collection
  kind: aspect
  title: Проход коллекции
  body: Что коллектор делает с кандидатами, когда они у него есть.
  origin: model/gc/cycle/questions.md, Y4, Y5, Y9
- id: a-semantics
  kind: aspect
  title: Семантика деструкторов
  body: Что язык обещает о моменте выполнения __destruct.
  origin: model/gc/cycle/questions.md, Y2
- id: a-layout
  kind: aspect
  title: Заголовок и размещение
  body: Где живут счётчики, биты и буферы кандидатов.
  origin: model/gc/cycle/questions.md, Y7
- id: q-y1
  kind: question
  status: decided
  title: Y1 — что мутатор платит на каждой записи
  body: 'Отвечено 2026-08-25: sliding view отклонён по чтению самой статьи. Барьер записи
    и есть механизм снимка, а четвёртый handshake приостанавливает каждый поток и сканирует
    его стек. Что переживает отделение от барьера — всё, что берёт rc-cycle: фильтр ациклических
    классов, теневой счёт CRC, созревание кандидатов и один линейный проход по всем кандидатам.'
  why: rc-walk построен на ограничении — мутатор не делает пооперационной работы для коллектора.
  origin: model/gc/cycle/questions.md, Y1, 2026-08-25
  refs:
  - file: model/gc/cycle/questions.md
    symbol: Y1.
- id: q-y2
  kind: decision
  status: decided
  title: Y2 — насколько позже может выполниться деструктор
  body: 'Разрешение вынесено: __destruct может выполниться позже обнуления счёта. Открыта
    граница — до конца запроса, до сброса арены, сохраняется ли порядок двух деструкторов,
    наблюдаема ли задержка вообще. На ответ опираются жадная очистка WeakMap и порядок сброса
    арены.'
  origin: model/gc/cycle/questions.md, Y2, 2026-08-25
  refs:
  - file: model/gc/cycle/questions.md
    symbol: Y2.
  why: 'Settled on the map: Деструктор вызывается сразу, как смерть установлена; память остаётся
    в арене до сброса — вызов и освобождение развязаны; крайний срок — деструкторный проход
    сброса арены'
- id: q-y3
  kind: decision
  status: decided
  title: Y3 — фильтр классов и направление его умолчания
  body: 'Класс подозреваем по умолчанию и покидает набор кандидатов только по доказательству:
    объявленные слоты не могут держать ссылку на вид, способный замкнуть кольцо (SlotKind
    в ll-model src/class.rs). «Пока не был в цикле» — факт одного прогона, и следующий запрос
    его опровергает, а ошибочно исключённый класс теряет свои циклы навсегда, потому что занесение
    срабатывает по фронту.'
  origin: model/gc/cycle/questions.md, Y3, 2026-08-25
  refs:
  - file: model/gc/cycle/questions.md
    symbol: Y3.
  why: 'Settled on the map: Класс подозреваем по умолчанию и выходит из кандидатов только
    по доказательству компилятора; рантайм, доказав цикличность класса, ставит флаг — флаг
    подозрение усиливает, а не снимает, и влияет на агрессивность обхода'
- id: q-y4
  kind: question
  status: decided
  title: Y4 — что заменяет trial deletion
  body: 'Отвечено 2026-08-25: теневой счёт CRC из статьи. Mark, scan и collect работают только
    с тенью; настоящий счёт трогается в одном месте — на стадии collect, для небелых детей
    действительно собранного цикла. Записанная альтернатива — side table из YRC: вердикт считается
    вне кучи, прерванная коллекция не пишет в кучу ни слова.'
  cost: Второе поле счёта на entity — вопрос узла Y7.
  origin: model/gc/cycle/questions.md, Y4, 2026-08-25
  refs:
  - file: model/gc/cycle/questions.md
    symbol: Y4.
- id: q-y5
  kind: decision
  status: decided
  title: Y5 — что переживает rc-walk
  body: 'Дорогая половина конкурентности построена и заново не выводится: handshake, точная
    проверка фазы 4 на владеющем потоке, парковка отложенного освобождения, ранняя смерть
    и правило 5 — коллектор судит, мутатор освобождает. Умирает фаза 1: перепись и полное
    построение рёбер.'
  origin: model/gc/cycle/questions.md, Y5
  refs:
  - file: model/gc/cycle/questions.md
    symbol: Y5.
  why: 'Settled on the map: Полный обход кучи уходит: остаётся обход корней, и его тоже можно
    резать. Освобождение зовёт и мутатор, и коллектор, но коллектор вправе звать только чистый
    деструктор либо разрушать объекты, у которых деструктора нет'
- id: q-y6
  kind: decision
  status: decided
  title: Y6 — набор кандидатов срабатывает по фронту
  body: 'Буферизация срабатывает на декременте, не дошедшем до нуля, поэтому отклонённое занесение
    не предлагается снова: пропущенный цикл не найдёт ни одна поздняя коллекция. Долг — правило
    для буфера, который не может расти; запасной ход — редкий полный обход.'
  origin: model/gc/cycle/questions.md, Y6
  refs:
  - file: model/gc/cycle/questions.md
    symbol: Y6.
  why: 'Корни не теряются: буфер обязан уметь расти, и двойной циклический буфер это делает
    свободно; пропуск корня при нехватке места отклонён Edmond''ом'
- id: q-y7
  kind: question
  status: open
  title: Y7 — что несёт заголовок
  body: При rc-trace коллектор циклов владеет двадцатью из тридцати двух бит слова флагов
    — цвет, buffered и семнадцатибитный индекс кандидата. Side table требует тег вместо индекса,
    фильтру классов нужен один бит, проставляемый при аллокации, а индекс — то, из-за чего
    уникальное владение осталось только у rc-walk.
  origin: model/gc/cycle/questions.md, Y7
  refs:
  - file: model/gc/cycle/questions.md
    symbol: Y7.
  why: 'Ограничение, Edmond 2026-08-25: заголовок не увеличивается — ни отдельного слова,
    ни лишнего байта. Тег коллекции пробовать в эпоховом байте (тот, которым gc-horizon-v2
    помечает роль корня); байт пишется одной атомарной записью в байт, не через слово флагов.
    Индекс кандидата не нужен: объект находится по записи в очереди корней. Раскладка оставшихся
    бит — эпоха, возраст созревания, признак «штамп или заявка» — за нами, Edmond её не решает.'
- id: q-y8
  kind: decision
  status: decided
  title: Y8 — что станет с rc-walk и его кодом
  body: 'rc-walk — построенное умолчание, а rc-cycle — ни строки кода, поэтому «вытеснен»
    не значит «удалён». Прецедент — режим capture-count: отклонён, сохранён записью, документы
    под баннером. Умолчание сдвигается по свидетельству — ответу Y1 и замеру, а не по предпочтению.'
  origin: model/gc/cycle/questions.md, Y8
  refs:
  - file: model/gc/cycle/questions.md
    symbol: Y8.
  why: 'Settled on the map: Код rc-walk не сохраняется под баннером: всё, что становится ненужным,
    удаляется'
- id: q-y9
  kind: decision
  status: decided
  title: Y9 — созревание кандидатов на вращающихся буферах
  body: 'k+1 вращающихся буферов; трассируются только кандидаты, оставшиеся кандидатами последние
    k коллекций, — в статье это отсеивает 40–80 % уже прошедших прочие фильтры. Рычага два,
    а не один: созревание решает, каких кандидатов трассировать, порог решает, когда коллекция
    запускается вообще. Открыто: значение k (замер) и размещение буферов (Y7).'
  origin: model/gc/cycle/questions.md, Y9, 2026-08-25
  refs:
  - file: model/gc/cycle/questions.md
    symbol: Y9.
  why: 'Settled on the map: Созревание держим возрастом в эпоховом штампе заголовка, карусель
    из k+1 буферов не нужна; к этому — бит «уже занесён» против повторов, срез рёбер в проштампованных
    выживших, порог запуска коллекции и пропуск доказуемо ацикличных мимо очереди. Значение
    k остаётся за замером'
- id: q-y10
  kind: decision
  status: decided
  title: Y10 — что проверка занесения исключает
  body: 'Декремент, не дошедший до нуля, заносит entity в подозреваемые, кроме «pure object»
    и классов с доказанной ацикличностью. У «pure» здесь два чтения, и ворота из них разные:
    чтение лестницы чистоты — деструктор не выполняет пользовательский код — для этих ворот
    дыряво: класс P0 с полем-объектом замыкает кольца как любой другой. Годное чтение — «не
    держит счётных слотов», это фильтр Y3 на уровень тоньше. Долг — какое чтение имел в виду
    Edmond.'
  origin: model/gc/cycle/questions.md, Y10, 2026-08-25
  refs:
  - file: model/gc/cycle/questions.md
    symbol: Y10.
  why: 'Settled on the map: Из подозреваемых исключаются только доказуемо ацикличные объекты;
    pure-деструктор (без воскрешения, только сам объект) к этому отбору отношения не имеет'
- id: q-y11
  kind: decision
  status: decided
  title: Y11 — две операции release, выбирает компилятор
  body: 'Компилятор порождает два декремента — простой и заносящий — и ставит простой всюду,
    где доказал, что entity удержана. Долг репозитория — контракт: две сигнатуры и покрывающее
    утверждение дешёвой операции. Ошибочный простой вызов — не потерянная оптимизация, а цикл,
    который не найдёт ни одна поздняя коллекция: занесение срабатывает по фронту.'
  origin: model/gc/cycle/questions.md, Y11, 2026-08-25
  refs:
  - file: model/gc/cycle/questions.md
    symbol: Y11.
  why: 'Простой -1 компилятор ставит в двух случаях: объект доказуемо ацикличен (то же доказательство,
    что в Y3), либо в этой точке доказуемо не может умереть — его держит ссылка, чей собственный
    -1 придёт позже и будет заносящим, так что занесение не теряется, а откладывается. Голого
    «после -1 объект держит кто-то ещё» недостаточно: держатель может лежать в том же кольце.'
- id: d-rc-cycle
  kind: decision
  status: decided
  title: Дизайн записи — rc-cycle
  body: 'Сбор циклов на лету поверх коалесцирующего вида: набор кандидатов от мутатора по
    Бэкону–Раджану, фильтр по классам, один линейный проход. rc-walk остаётся построенным
    умолчанием, его текст в силе, под баннером.'
  why: Цена обхода — куча, а урожай — циклы. Пара кандидата стоит около 0,4 нс против примерно
    140 нс на entity за эпоху у обхода; точка пересечения — около 360 нефинальных декрементов
    на живую entity за эпоху, куда обычная программа не добирается.
  origin: dev/DECISIONS.md, 2026-08-25 (пятая запись)
- id: d-destruct-later
  kind: decision
  status: decided
  title: __destruct может выполниться позже обнуления
  body: 'Вынесено Edmond: PHP не обещает мгновения. Дизайн может отложить деструктор за последний
    release, не нарушая обещаний языка. Границы решение не называет — граница за узлом Y2.'
  why: Отложенный и коалесцирующий подсчёт перестают отпадать из-за времени деструктора; отказ
    от sliding view теряет одну из трёх опор и стоит на двух оставшихся.
  origin: dev/DECISIONS.md, 2026-08-25 (шестая запись)
- id: r-sliding-view
  kind: rejected
  status: rejected
  title: Sliding views Леванони и Петранка
  body: Отклонено по чтению самой статьи. Барьер записи и есть механизм снимка — формы без
    барьера у алгоритма нет, — а четвёртый handshake приостанавливает каждый поток и сканирует
    его стек, пока §4.2 строит разность корней между коллекциями.
  origin: model/gc/cycle/questions.md, Y1, 2026-08-25
- id: q-traversal-aggression
  kind: question
  title: Степень агрессивности обхода и роль флага класса
  body: 'Коллекция обходит не всех кандидатов сразу. Чем меряется степень агрессивности и
    как на неё влияет флаг класса, поставленный рантаймом после доказанного цикла, — пока
    не решено. Edmond, разговор на карте: «он может влиять на степень агрессивности; скажем,
    у нас будет оптимизация обхода объектов, мы не сразу будем все обходить. Пока это ещё
    не ясно».'
  origin: разговор на карте, 2026-08-25
  status: open
- id: q-root-queue
  kind: question
  title: 'Очередь корней: быстрая запись мутатором, свободное чтение коллектором'
  body: 'Корни даёт сама операция -1, поэтому цена занесения ложится на горячий путь мутатора,
    а читать очередь коллектор должен в фоне, не останавливая писателя. Нужен алгоритм добавления
    с такими свойствами. Кандидаты: взять готовый из Nim (полосатые очереди yrc.nim) или двойной
    циклический буфер — очередь на одного писателя и одного читателя в разных потоках с быстрым
    переключением буферов; такая структура в Limelight уже сделана. Сюда же входит поведение
    при исчерпании места.'
  origin: разговор на карте, 2026-08-25
  status: open
  options:
  - двойной циклический буфер, один писатель и один читатель, быстрое переключение (наш, /home/edmond/spsc-refactor)
  - своё, ещё не придумано
  why: 'Вариант «взять из Nim» Edmond отклонил 2026-08-25: полоса там фиксированная, а при
    заполнении писатель сам становится коллектором. Своё решение отложено — думать самим.'
