    origin: model/gc/cycle/questions.md, Y2

  - id: a-layout
    kind: aspect
    title: Заголовок и размещение
    body: Где живут счётчики, биты, штамп эпохи и очередь корней.
    origin: model/gc/cycle/questions.md, Y7

  - id: q-y1
    kind: question
    status: decided
    title: Y1 — брать ли sliding view, и что он стоит мутатору
    body: >-
      Sliding view отклонён, и после круга критика отказ стоит на двух
      настоящих опорах. Первая — неустранимость лога: пропущенное занесение
      у нас — отсрочка (покрывающее утверждение Y11), и компилятор удаляет
      проверку в доказанных местах, а пропущенная запись лога — неверная
      коллекция, и исключений у неё нет, плюс безусловный snoop-тест на
      каждой записи. Вторая — у живого счёта есть синхронные потребители,
      которым лог не служит: проверка разделения COW, тождество RC − IN,
      точная проверка, немедленная смерть при нуле.
    why: >-
      Опасная гонка: коллектор решил «кольцо мёртвое», а мутатор в этот
      момент вытащил ссылку на его члена в локальную переменную —
      освобождение убьёт живой объект. Статья ловит это через snooped set,
      часть барьера записи, и с отказом от барьера защита умерла. Вместо
      неё — точная проверка rc-walk: перед смертью компоненты
      поток-владелец сам перечитывает её поля, и гонки нет по построению —
      он же выполняет программный код. Остальные пять взятых частей
      (фильтр, теневой счёт, созревание, один проход, порядок collect) —
      экономия; от освобождения живого защищает только эта проверка.
    origin: model/gc/cycle/questions.md, Y1, 2026-08-25
    refs:
      - file: model/gc/cycle/questions.md
        symbol: "Y1."

  - id: q-y2
    kind: question
    status: decided
    title: Y2 — насколько позже может выполниться деструктор
    body: >-
      Решено: деструктор вызывается сразу, как смерть установлена — при
      обнулении немедленно, у цикла в момент подтверждения коллекцией.
      Память остаётся в арене до сброса, вызов и освобождение развязаны.
      Крайний срок — деструкторный проход самого сброса арены: он и есть
      страховка, финальная коллекция в конце запроса не нужна. Порядок двух
      отложенных деструкторов не обещан.
    origin: model/gc/cycle/questions.md, Y2; dev/DECISIONS.md, седьмая запись 2026-08-25
    refs:
      - file: model/gc/cycle/questions.md
        symbol: "Y2."

  - id: q-y3
    kind: question
    status: decided
    title: Y3 — фильтр классов и направление его умолчания
    body: >-
      Решено: класс подозреваем по умолчанию и покидает набор только по
      доказательству компилятора (объявленные слоты не могут держать вид,
      замыкающий кольцо, — SlotKind). Вторая половина: рантайм, доказавший
      цикличность класса на живом цикле, ставит флаг — флаг только усиливает
      подозрение, никогда не выводит из набора, и питает агрессивность
      обхода (Y13). Правило против SlotKind и доля классов по корпусу —
      шаг S6.3.
    origin: model/gc/cycle/questions.md, Y3; dev/DECISIONS.md, восьмая запись 2026-08-25
    refs:
      - file: model/gc/cycle/questions.md
        symbol: "Y3."

  - id: q-y4
    kind: question
    status: decided
    title: Y4 — что заменяет trial deletion
    body: >-
      Теневой счёт CRC: mark, scan и collect работают только с тенью,
      настоящий счёт трогается один раз — на стадии collect, для небелых
      детей действительно собранного цикла. Альтернатива записана и не
      выбрана: side table из YRC, вердикт вне кучи.
    cost: Второе поле счёта на entity — раскладка за Y7.
    origin: model/gc/cycle/questions.md, Y4, 2026-08-25
    refs:
      - file: model/gc/cycle/questions.md
        symbol: "Y4."

  - id: q-y5
    kind: question
    status: decided
    title: Y5 — что переживает rc-walk
    body: >-
      Решено: перепись умирает, дисциплина владения выживает. Полный обход
      кучи уходит — коллекция трассирует только от кандидатов. Освобождать
      могут оба, но коллектор сам зовёт только чистый деструктор или
      разрушает объект без деструктора; нечистый идёт на поток-владелец —
      для этого и остаются handshake, точная проверка фазы 4, парковка и
      ранняя смерть. Открытый шов от критика: чем перепроверяется
      собственное освобождение коллектора, точная проверка его не
      покрывает.
    origin: model/gc/cycle/questions.md, Y5; dev/DECISIONS.md, девятая запись 2026-08-25
    refs:
      - file: model/gc/cycle/questions.md
        symbol: "Y5."

  - id: q-y6
    kind: question
    status: decided
    title: Y6 — набор кандидатов срабатывает по фронту
    body: >-
      Решено: занесение никогда не теряет корень. Пропуск при полном буфере
      отклонён — потерянное занесение это цикл, который не найдёт ни одна
      поздняя коллекция, — и запасной полный обход ушёл вместе с ним. Буфер
      растёт; рост — родное свойство очереди из Y12.
    origin: model/gc/cycle/questions.md, Y6; dev/DECISIONS.md, десятая запись 2026-08-25
    refs:
      - file: model/gc/cycle/questions.md
        symbol: "Y6."

  - id: q-y7
    kind: question
    status: open
    title: Y7 — что несёт заголовок
    body: >-
      Ограничение вынесено: заголовок не растёт — ни слова, ни байта. Тег
      коллекции пробуется в эпоховом байте rc-walk (offset 6, одна
      атомарная запись в байт), семнадцатибитный индекс кандидата не нужен
      вовсе — объект находится по записи в очереди корней (Y12), и биты
      освобождаются. Открыта раскладка: эпоха, возраст созревания, признак
      «штамп или заявка» — шаг S6.5.
    origin: model/gc/cycle/questions.md, Y7; dev/DECISIONS.md, одиннадцатая запись 2026-08-25
    refs:
      - file: model/gc/cycle/questions.md
        symbol: "Y7."

  - id: q-y8
    kind: question
    status: decided
    title: Y8 — что станет с rc-walk и его кодом
    body: >-
      Решено: код не ждёт под баннером — всё, что rc-cycle делает ненужным,
      удаляется из ll-model по мере появления замены. Прецедент
      capture-count действует для документов: они остаются записью. Смена
      умолчания реестра по-прежнему по свидетельству — замер, не
      предпочтение.
    origin: model/gc/cycle/questions.md, Y8; dev/DECISIONS.md, двенадцатая запись 2026-08-25
    refs:
      - file: model/gc/cycle/questions.md
        symbol: "Y8."

  - id: q-y9
    kind: question
    status: decided
    title: Y9 — созревание кандидатов
    body: >-
      Решено: созревание — возраст в эпоховом штампе заголовка (приём YRC),
      а не карусель из k+1 буферов. Коммит штампует доказанно живую
      компоненту эпохой и возрастом (минимум по членам плюс один); заявка
      читает возраст назад, и созревший член срезается до конца эпохи
      вместо повторной трассировки. С этим взяты бит «уже занесён», порог
      запуска коллекции (у YRC адаптивный от 128) и отдельный буфер
      выживших. Значение k — замер; в YRC оно 3.
    origin: model/gc/cycle/questions.md, Y9; dev/DECISIONS.md, одиннадцатая запись 2026-08-25
    refs:
      - file: model/gc/cycle/questions.md
        symbol: "Y9."

  - id: q-y10
    kind: question
    status: decided
    title: Y10 — что проверка занесения исключает
    body: >-
      Решено: ворота одни — доказанная ацикличность. Pure к отбору
      отношения не имеет: чистота деструктора ничего не говорит о ссылках,
      которые объект держит, и Edmond снял эту оговорку сам. Чистота
      возвращается в Y5 — коллектор сам зовёт только чистый деструктор.
    origin: model/gc/cycle/questions.md, Y10; dev/DECISIONS.md, восьмая запись 2026-08-25
    refs:
      - file: model/gc/cycle/questions.md
        symbol: "Y10."

  - id: q-y11
    kind: question
    status: decided
    title: Y11 — две операции release, выбирает компилятор
    body: >-
      Решено, покрывающее утверждение: простой -1 законен ровно в двух
      случаях — объект доказуемо ацикличен (доказательство Y3, поднятое в
      компиляцию), или в этой точке доказуемо не может умереть: его держит
      ссылка, чей собственный поздний release будет заносящим, так что
      занесение откладывается, а не теряется. Голого «кто-то ещё держит»
      мало — держатель может лежать в том же кольце. Поднято до правила об
      объекте (четырнадцатая запись): доказанное владение исключает объект
      из корней целиком — заносящая обязанность едет на release самого
      владеющего ребра, и то же доказательство убирает ещё −1: саму счётную
      пару в доказанных местах, как элизии gc-horizon. Осталось записать
      две сигнатуры; умолчание без доказательства — заносящая форма везде.
    origin: model/gc/cycle/questions.md, Y11; dev/DECISIONS.md, восьмая запись 2026-08-25
    refs:
      - file: model/gc/cycle/questions.md
        symbol: "Y11."

  - id: q-y12
    kind: question
    status: open
    title: Y12 — очередь корней
    body: >-
      Пишет мутатор на горячем пути, читает коллектор в фоне, корень не
      теряется — буфер растёт. Кандидат уже построен: двойной циклический
      SPSC-буфер с handoff из spsc-refactor (Zend/zend_spsc_queue) — по
      одной очереди на поток. Полосатые очереди YRC отклонены. Граница OOM
      решена: неудавшийся рост берёт из зарезервированной критической
      области, и рантайм не возвращается в обычный режим, пока не пройдены
      все корни. Открыт контракт — чтение, место бита «уже занесён»,
      партия коллектора — шаг S6.4.
    origin: model/gc/cycle/questions.md, Y12; dev/DECISIONS.md, десятая и тринадцатая записи 2026-08-25
    refs:
      - file: model/gc/cycle/questions.md
        symbol: "Y12."

  - id: q-y13
    kind: question
    status: open
    title: Y13 — агрессивность обхода
    body: >-
      Коллекция не трассирует всех кандидатов сразу: какая-то мера
      агрессивности решает, сколько и когда. Флаг доказанно циклического
      класса (Y3) эту агрессивность повышает. Открыт намеренно — «пока это
      ещё не ясно»; соседствует с порогом запуска и созреванием Y9, и все
      три — разные рычаги.
    origin: model/gc/cycle/questions.md, Y13, 2026-08-25
    refs:
      - file: model/gc/cycle/questions.md
        symbol: "Y13."

  - id: d-rc-cycle
    kind: decision
    status: decided
    title: Дизайн записи — rc-cycle
    body: >-
      Сбор циклов на лету от набора кандидатов, который называет сам
      мутатор: пара кандидата ~0,4 нс против ~140 нс на entity за эпоху у
      обхода, пересечение у 360 нефинальных декрементов на живую entity за
      эпоху. rc-walk остаётся построенным умолчанием под баннером.
    origin: dev/DECISIONS.md, пятая запись 2026-08-25

  - id: d-destruct-later
    kind: decision
    status: decided
    title: __destruct может выполниться позже обнуления
    body: >-
      PHP не обещает мгновения; отложить деструктор за последний release —
      не нарушение. Границу дал ответ Y2: сразу по установлению смерти,
      крайний срок — деструкторный проход сброса арены.
    origin: dev/DECISIONS.md, шестая и седьмая записи 2026-08-25

  - id: r-sliding-view
    kind: rejected
    status: rejected
    title: Sliding views Леванони и Петранка
    body: >-
      Отклонено. Барьер записи и есть механизм снимка — формы без барьера
      нет, и пропуск записи лога это неверная коллекция; у живого счёта
      есть синхронные потребители, которым восстановленный на коллекции
      счёт не служит. Гибрид «лог поверх точных счётов» отклонён той же
      первой опорой: платит неустранимую цену лога поверх счётов, которые
      должен был сэкономить.
    origin: model/gc/cycle/questions.md, Y1, 2026-08-25

