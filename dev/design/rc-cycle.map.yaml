    title: Переход от rc-walk
    body: Что переходит в новый дизайн, что остаётся записью и по каким свидетельствам меняется умолчание реестра.
    origin: model/gc/cycle/questions.md, Y1 и Y8

  - id: a-enrolment
    kind: aspect
    title: Занесение в подозреваемые при декременте
    body: Сторона мутатора — какой декремент рождает подозреваемого, сколько стоит проверка, где компилятор её убирает и куда пишется корень.
    origin: model/gc/cycle/questions.md, Y3, Y6, Y10, Y11, Y12

  - id: a-collection
    kind: aspect
    title: Проход коллекции
    body: Что коллектор делает с кандидатами, когда они у него есть, и сколько из них трогает за раз.
    origin: model/gc/cycle/questions.md, Y4, Y5, Y9, Y13

  - id: a-semantics
